# DIAL-MPC
seed: 0
output_dir: unitree_go2_trot
n_steps: 400

env_name: unitree_go2_walk
Nsample: 2048
Hsample: 16
Hnode: 4
Ndiffuse: 2
Ndiffuse_init: 10
temp_sample: 0.05
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi

# Base environment
dt: 0.02
# Two physics substeps per control step.  At a single 20 ms step MuJoCo's soft
# joint-limit constraint does not converge and `done` fires on a sub-degree
# limit violation during normal walking; 0.01 removes that entirely.
timestep: 0.01
leg_control: torque
# Close the joint PD loop every physics substep rather than holding the torque
# computed at the start of the control step, as a real motor driver does.
pd_substep: true
action_scale: 1.0

# Go2
# A joint touching its limit is solver slack, not a fall; terminate only on the
# conditions that mean the robot is down.
terminate_on_joint_limit: false
default_vx: 0.8
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 1.0
gait: trot
reward_weights: [1.0, 1.0, 1.0]
