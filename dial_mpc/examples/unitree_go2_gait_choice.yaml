# DIAL-MPC -- velocity-command locomotion where the weight picks the gait.
#
# There is no gait reference in this task.  The four rows say what the operator
# cares about (track the command / go far on a charge / keep the payload steady
# / land gently) and leave the gait itself as the thing omega decides.
seed: 0
output_dir: unitree_go2_gait_choice
n_steps: 300

env_name: unitree_go2_gait_choice
Nsample: 2048
# A horizon shorter than one gait cycle cannot see the cost of a stride it has
# not finished paying for, which is why the walking task never resolved its
# energy trade-off.  The measured cadence here is 2.5-3.0 Hz, so a cycle is
# 0.33-0.40 s and 24 x 0.02 s = 0.48 s covers one comfortably.  The first
# attempt used 0.64 s on an assumed 2 Hz trot; that is twice as long as needed
# and every one of 2049 perturbed samples fell inside it.
Hsample: 24
Hnode: 6
# The two-level schedule leaves a final noise of sigma/2, and every one of 2049
# samples fell inside the horizon -- the softmax was ranking least-catastrophic
# falls with an effective sample size of two.  Four levels take the final noise
# to sigma/8.
Ndiffuse: 4
Ndiffuse_init: 10
# Measured, not inherited.  On the same cloud the effective sample size runs
# 0.3-2.2% at 0.05, 2.7-6.9% at 0.10 and 16.5-25.2% at 0.25.  At 0.05 the
# softmax is an argmax over two samples out of 2049, so the "update" it
# produces is one lucky rollout and every discriminativeness number measured
# through it is noise.
temp_sample: 0.25
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi

# Base environment
dt: 0.02
timestep: 0.01
leg_control: torque
pd_substep: true
action_scale: 1.0
terminate_on_joint_limit: false

# Go2
kp: 30.0
kd: 0.0
# Matches the trot configuration exactly, so a plan and a pipeline state can
# be handed straight from the bootstrap instance to the measured one.
enable_body_collisions: false
gait: stand
nominal_height: 0.30
# Brisk on purpose.  At a stroll all four rows agree on the same comfortable
# gait and the basis degenerates the way the walking basis did.
default_vx: 1.2
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 0.4
randomize_tasks: false
command_resample_steps: 500
reward_weights: [1.0, 1.0, 1.0, 1.0]
# Price rows 1-3 per metre travelled, not per second.  Without this the rows
# are 92-93% explained by the realised speed alone, because slowing down is the
# cheapest way to lower any rate per unit time.
speed_floor: 0.05

# Row normalizers.  An earlier revision rescaled these by up to 12x from a
# cloud standard deviation, but that cloud had a fall rate of 1.000, so what
# was equalised was the spread of the falls and not of the gaits.  These are
# the values that put the four rows within 2x of each other on a healthy
# trotting trajectory (-2.14 / -1.30 / -1.38 / -1.05 per step at uniform
# weights), which is the distribution the planner actually works in.
# Equalised, but at constant total magnitude.  On a healthy cloud (fall rate
# 0.22) the four row standard deviations were 1.179 / 0.076 / 0.831 / 0.080:
# energy and contact move the sample returns 15x less than tracking does, so
# their weight barely reaches the softmax -- which is why boost1 and boost3
# select 41-59% of the same elite samples as uniform.  Equalising by raising
# the weak rows alone is what broke the bootstrap earlier, so the four
# multipliers are divided by their geometric mean: the rows come level while
# the average row magnitude, and hence the bootstrap's grip, is untouched.
track_scale: 0.426
energy_scale: 27.3
payload_scale: 2.99
contact_scale: 0.144
# The bootstrap has to hold a trot against these rows, so its gait term needs
# to outweigh them rather than merely join them.
bootstrap_gait_weight: 5.0
