seed: 0
output_dir: unitree_go2_gait
n_steps: 400
env_name: unitree_go2_gait
Nsample: 2048
Hsample: 32
Hnode: 8
Ndiffuse: 2
Ndiffuse_init: 10
# Raw-Gibbs sampling temperature.  Re-measured after heading entered the floor
# (csm_runs/gait_yaw_temp.py): the label statistics barely moved -- gait share
# of the label 0.351 -> 0.348, ESS 7.6% -> 7.4% -- because reward_yaw sits near
# zero while the robot tracks and so adds little to the return spread.  Raising
# T lifts SNR toward 1.00 but drops the gait share to 0.20, under the fit's own
# error; 0.15 is the setting that produced a policy holding all four gaits.
temp_sample: 0.15
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi
dt: 0.02
timestep: 0.01
leg_control: torque
pd_substep: true
action_scale: 1.0
terminate_on_joint_limit: false
default_vx: 0.6
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 1.0
gait: trot
randomize_tasks: true
command_resample_steps: 50
command_vx_min: 0.6
command_vx_max: 1.0
command_vy_min: -0.15
command_vy_max: 0.15
command_vyaw_min: -0.3
command_vyaw_max: 0.3
translation_invariant_observation: true
yaw_error_observation: true
reward_weights:
- 1
- 1
- 1
- 1
# The objective, stated here in full so it cannot disagree with the dataclass
# defaults -- gait_scale used to be set only here (1.551, a x0.064 pattern term)
# while the floors were only in the env, and that split is how an objective the
# planner could not walk went unnoticed.  Chosen by csm_runs/gait_pick.py over
# 3 seeds x 3 commands, measured after the 50-step command ramp finishes:
# all four gaits at 0.87-0.88, zero falls, and 0.91-0.98 of the commanded speed.
#
# track_floor had to go well past its original 0.3.  Strengthening the gait term
# alone reaches the pattern but starves the velocity term -- the robot walks a
# clean gait at two thirds of the command -- and then destabilises it.  Raising
# the tracking floor with it buys the speed back *and* the stability, because
# the floor is what keeps the robot moving underneath the pattern.  Tracking
# saturates around 2.0-2.5; past 3.0 the pattern starts eroding for nothing.
gait_scale: 0.2
track_floor: 2.5
posture_floor: 0.3
# Heading's share of the tracking floor.  Swept with DIAL under raw Gibbs
# (csm_runs/gait_yaw_pick.py): at 0 the planner drifts up to 82 deg and ignores
# a yaw command entirely (0.45 rad/s of error); 0.6 is where the improvement
# saturates, at 9 deg worst-case drift and 0.06 rad/s.  Gait pattern and speed
# are unchanged across the whole sweep -- heading costs nothing here.
yaw_weight: 0.6
