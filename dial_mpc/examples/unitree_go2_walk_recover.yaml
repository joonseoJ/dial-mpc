# DIAL-MPC -- absorb a push while walking.
#
# The nominal is a steady gait at the commanded velocity.  An impulse hits the
# base between control steps, so the planner never sees it coming, and the four
# rows price the four channels the impulse can be absorbed through: put the
# feet somewhere else, spend trunk attitude, spend joint torque, or let the
# velocity drift.  Every row is a deviation from the same nominal and every row
# is scaled by the same push, which is what the gait-choice basis could not
# arrange -- there a mission row and three preference rows had ranges 15x apart.
seed: 0
output_dir: unitree_go2_walk_recover
n_steps: 200

env_name: unitree_go2_walk_recover
Nsample: 2048
# 0.48 s covers one cycle of the measured 2.5-3.0 Hz trot.  Longer was tried:
# at 0.64 s every one of 2049 perturbed samples fell inside the horizon.
Hsample: 24
Hnode: 6
# Four annealing levels put the final proposal noise at sigma/8.  Two levels
# left it at sigma/2 and the cloud was all falls.
Ndiffuse: 4
Ndiffuse_init: 10
# Measured on this plant rather than inherited.  On the walk-recovery cloud the
# effective sample size is 0.2% at 0.05, 4-6% at 0.25 and 19-22% at 0.5, so
# this is the first temperature at which the softmax is an average rather than
# an argmax over a handful of samples.
temp_sample: 0.5
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi

# Base environment
dt: 0.02
timestep: 0.01
leg_control: torque
pd_substep: true
action_scale: 1.0
terminate_on_joint_limit: false

# Go2
kp: 30.0
kd: 0.0
enable_body_collisions: false
gait: trot
nominal_height: 0.30
default_vx: 0.8
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 0.4
randomize_tasks: false
command_resample_steps: 500

# Impulse on the floating base, m/s.
# 0.6 m/s on top of a 0.8 m/s walk was too much: 43-62% of the sample cloud
# fell for a forward push, and every weight ended the recovery window with a
# velocity error larger than the command itself.
push_linear_velocity: 0.35
push_scale_min: 0.4

# Row normalizers.  Measured spreads on a healthy cloud (fall rate 0.000) were
# 0.271 / 0.168 / 0.033 / 1.548: the velocity row moves the sample returns 46x
# more than the effort row, and boost2's cost diagonal was a 0.07% tie because
# of it.  Applied at damping 0.75 rather than in full -- an undamped jump from
# a small-cloud measurement put the robot on the ground before the push landed,
# and the multipliers are already magnitude-neutral so the damping costs only
# convergence speed.
# Deadbands: steady walking produces about 0.09 rad^2 of squared trunk rate and
# 420 (N m)^2 of squared torque, so rows 1 and 2 stay silent through normal
# locomotion and price only what the push adds.
# Row 0's deadband grows with the square of the commanded speed, because that
# is how the nominal foot sweep grows.  Without it the row opposes walking
# outright: at a 0.8 m/s command the robot settled at 0.25 m/s, exactly where
# -5.08 v^2 (stepping) and -2.32 (v - 0.8)^2 (velocity) balance.
step_baseline_coeff: 0.118
trunk_baseline: 0.10
effort_baseline: 450.0

step_scale: 0.0233
trunk_scale: 1.635
effort_scale: 121.0
velocity_scale: 0.431

# Search assistance, never part of the measured objective: sampling MPC does
# not find a gait from a standing plan, so a separate instance with this term
# switched on drives the robot into a trot and hands over its state and plan.
bootstrap_gait_weight: 5.0

reward_weights: [1.0, 1.0, 1.0, 1.0]
