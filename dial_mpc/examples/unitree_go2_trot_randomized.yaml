# DIAL-MPC + compositional-energy training environment with bounded reset and
# command randomization.  Planner, objectives, losses, and inference match
# unitree_go2_trot.yaml; only the state/query distribution is broadened.
seed: 0
output_dir: unitree_go2_trot_randomized
n_steps: 400

env_name: unitree_go2_walk
Nsample: 2048
Hsample: 16
Hnode: 4
Ndiffuse: 2
Ndiffuse_init: 10
temp_sample: 0.05
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi

# Base environment
dt: 0.02
timestep: 0.02
leg_control: torque
action_scale: 1.0

# Go2 nominal command; also used by nominal evaluation.
default_vx: 0.8
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 1.0
gait: trot
reward_weights: [1.0, 1.0, 1.0]

# Target command distribution.  These ranges keep forward trot dominant while
# covering lateral motion and moderate turning.  One command lasts 5 seconds.
randomize_tasks: true
command_vx_min: 0.4
command_vx_max: 1.1
command_vy_min: -0.2
command_vy_max: 0.2
command_vyaw_min: -0.5
command_vyaw_max: 0.5
command_resample_steps: 250

# Reset distribution.  Angles and angular velocities use radians.
randomize_start_state: true
start_xy_noise: 0.05
start_height_noise: 0.015
start_rpy_noise: 0.05
start_joint_position_noise: 0.08
start_body_linear_velocity_noise: 0.15
start_body_angular_velocity_noise: 0.15
start_joint_velocity_noise: 0.30
