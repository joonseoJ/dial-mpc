# DIAL-MPC -- the walking basis, run under the push-recovery methodology.
#
# The walking fields were trained before any of what made the push-recovery
# basis work: the weights were not unit-normalised, DIAL's spread normalisation
# was left on so the objective was not a Gibbs distribution at a known
# temperature, the composition was solved in omega with the coefficients
# renormalised to sum to one, the annealing levels shared one temperature, and
# the temperature itself was inherited rather than measured.  This config exists
# so that if the walking basis fails again it fails under the conditions the
# push-recovery basis succeeded under, and the difference is the basis rather
# than the machinery.
seed: 0
output_dir: unitree_go2_trot_csm
n_steps: 400

env_name: unitree_go2_walk
Nsample: 2048
Hsample: 16
Hnode: 4
Ndiffuse: 2
Ndiffuse_init: 10
# Measured on this task, not inherited.  On a shared cloud the effective sample
# size runs 0.3-1.4% at 0.05 -- the value every earlier walking run used, and an
# argmax over a handful of samples -- against 12.8-23.8% at 0.2, which is the
# band the push-recovery basis was collected in.
temp_sample: 0.2
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi

# Base environment -- identical to unitree_go2_trot.yaml.
dt: 0.02
timestep: 0.01
leg_control: torque
pd_substep: true
action_scale: 1.0
terminate_on_joint_limit: false
default_vx: 0.8
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 1.0
gait: trot
reward_weights: [1.0, 1.0, 1.0]

# Row normalizers.  One at each for now: the methodology is being matched
# first, and the equalisation measured on top of it afterwards.
track_scale: 1.0
stability_scale: 1.0
gait_scale: 1.0
