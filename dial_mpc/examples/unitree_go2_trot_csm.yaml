# DIAL-MPC -- the walking basis, run under the push-recovery methodology.
#
# The walking fields were trained before any of what made the push-recovery
# basis work: the weights were not unit-normalised, DIAL's spread normalisation
# was left on so the objective was not a Gibbs distribution at a known
# temperature, the composition was solved in omega with the coefficients
# renormalised to sum to one, the annealing levels shared one temperature, and
# the temperature itself was inherited rather than measured.  This config exists
# so that if the walking basis fails again it fails under the conditions the
# push-recovery basis succeeded under, and the difference is the basis rather
# than the machinery.
seed: 0
output_dir: unitree_go2_trot_csm
n_steps: 400

env_name: unitree_go2_walk
Nsample: 2048
Hsample: 16
Hnode: 4
Ndiffuse: 2
Ndiffuse_init: 10
# Measured under the objective the collection actually runs.  An earlier pass
# picked 0.2 and then 0.3 from an effective-sample-size table computed with
# DIAL's spread normalisation left on -- but the collection is raw Gibbs, and
# the same temperature means something completely different there.  Measured
# raw, 0.3 gives 93-98% effective samples (a near-uniform average, and the
# cross-evaluation diagonal collapses to 3/7), while the band the push-recovery
# basis was collected in sits near 0.008-0.02: 7-12% at 0.008, 43-49% at 0.02,
# with the diagonal back to 7/7 at 0.02.  This task is far more temperature
# sensitive than the stand-and-resist one, whose diagonal held from 0.05 to 1.0
# -- walking on flat ground makes every sample's return look alike.
temp_sample: 0.015
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi

# Base environment -- identical to unitree_go2_trot.yaml.
dt: 0.02
timestep: 0.01
leg_control: torque
pd_substep: true
action_scale: 1.0
terminate_on_joint_limit: false
default_vx: 0.8
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 1.0
gait: trot

# Randomised commands.  Every earlier walking collection ran at a single
# command -- 0.8 m/s straight -- so the fields saw one point of a three
# dimensional input they are conditioned on, and a turn at evaluation time was
# simply off the training distribution.  The stand-and-resist basis never had
# this problem because its disturbance was sampled in magnitude and heading;
# this is the walking equivalent.
#
# Resampling inside the episode rather than only at reset means the fields also
# see the transitions, which is what a joystick actually produces.  The ramp
# only applies to the opening command, so a mid-episode change takes effect at
# once.
randomize_tasks: true
command_resample_steps: 50
# Narrowed.  The first randomised collection used vx 0.2-1.2, vy +-0.3,
# vyaw +-0.8, and 822k queries spread over that volume left the fields far too
# thin: validation error went 0.150 -> 0.197-0.242 against the fixed-command
# run, and that 30% was the difference between a policy that tracks DIAL to
# within 4% and one that falls in half its episodes (mean cost ratio 28, 42
# falls in 80 episodes).  This box is a thirteenth of the volume, which puts
# the density back near the fixed-command run's while still asking the fields
# to be conditioned on a command rather than memorise one.
command_vx_min: 0.6
command_vx_max: 1.0
command_vy_min: -0.15
command_vy_max: 0.15
command_vyaw_min: -0.3
command_vyaw_max: 0.3
# Observation symmetry.  The three reward rows never look at where the robot
# is or which way it faces, but `qpos` went into the observation whole, so the
# fields were conditioned on world x, y and absolute yaw -- inputs that grow
# with the episode.  Fitted on 150-step episodes and deployed for 1500, the
# student fell at about 11 s, roughly where x left the fitted range, and
# lengthening the episodes only moves that wall in proportion.  Zeroing x and
# y in the observation alone, physics untouched, took four of eight target
# weights from falling at 5-14 s to walking the full 30 s.
translation_invariant_observation: true
yaw_error_observation: true

reward_weights: [1.0, 1.0, 1.0]

# Row normalizers, measured on a shared cloud at this temperature and applied
# at constant total magnitude (the multipliers divided by their geometric mean).
# Raw spreads were 0.0397 / 0.0139 / 0.0639: the gait row moves the sample
# returns 4.6x more than the stability row, which is the same imbalance the
# per-level profile showed (the gait-boosted weight's coarse-to-fine spread
# ratio was 6.26 against the tracking-boosted weight's 2.54) and the same one
# the live viewer showed in the per-row rewards.  Three measurements, one
# direction.
track_scale: 1.211
stability_scale: 0.424
gait_scale: 1.946
