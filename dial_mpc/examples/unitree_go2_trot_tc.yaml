# DIAL-TC-MPPI: DIAL diffusion-style annealing with TC-MPPI sampling
seed: 0
output_dir: unitree_go2_trot_tc
n_steps: 400

env_name: unitree_go2_walk
Nsample: 2048
Hsample: 16
Hnode: 4
Ndiffuse: 2
Ndiffuse_init: 10
temp_sample: 0.05
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi

# TC-MPPI parameters.  There must be d+1 derivative weights.
time_correlated: true
tc_history_length: 2
tc_mean_mode: dial
tc_derivative_weights: [1.0, 0.0, 0.00003]
tc_importance_scale: 0.0

# Base environment
dt: 0.02
timestep: 0.02
leg_control: torque
action_scale: 1.0

# Go2
default_vx: 0.8
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 1.0
gait: trot
include_gait_phase_observation: true
reward_weights: [1.0, 1.0, 1.0]
