# DIAL-MPC -- stand and resist a push.
seed: 0
output_dir: unitree_go2_push_recover
n_steps: 60

env_name: unitree_go2_push_recover
Nsample: 2048
Hsample: 24
Hnode: 6
Ndiffuse: 2
Ndiffuse_init: 10
temp_sample: 0.05
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi

# Base environment
dt: 0.02
timestep: 0.01
leg_control: torque
action_scale: 1.0
pd_substep: true
terminate_on_joint_limit: false

# Go2
kp: 30.0
kd: 0.0
enable_body_collisions: true
nominal_height: 0.30
push_linear_velocity: 1.0
push_scale_min: 0.25
reward_weights: [1.0, 1.0, 1.0, 1.0]
