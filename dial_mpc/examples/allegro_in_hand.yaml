# DIAL-MPC -- reorient an object in the hand, with the weight deciding how.
#
# Sampling MPC earns its place here: the hand makes and breaks contact every few
# control steps and gradients through those events point the wrong way.  And the
# weight is a preference someone states out loud -- "this one is fragile" -- and
# it belongs to the object rather than to the algorithm, which is the setting
# where composing trained score fields at run time beats retraining per object.
seed: 0
output_dir: allegro_in_hand
n_steps: 200

env_name: allegro_in_hand
Nsample: 2048
Hsample: 20
Hnode: 5
# Four levels, not two: at two the final proposal noise is sigma/2, which on a
# sixteen-joint hand holding a 10 g ball threw it out of the grasp in 92-98% of
# samples.  Four takes it to sigma/8.
Ndiffuse: 4
# Back to 10.  Halving it alongside the timestep change cost more than the
# timestep saved: closed-loop spin fell from 0.23 to 0.06 rad/s at uniform
# weights.  In a task where most samples drop the object, the quality of the
# opening plan carries the whole episode.
Ndiffuse_init: 10
# Swept, not inherited.  The effective sample size is 0.1% at 0.05 and 1.0% at
# 0.25 -- both an argmax -- and 46-49% at 1.0, in every sampler setting tried.
# The curve between 0.25 and 1.0 is steep enough that stopping the sweep at
# 0.25, as an earlier pass did, reads as "temperature cannot fix this".
#
# Temperature and perturbation size cannot be chosen apart.  A wider action box
# (0.30 rad) gave a cloud that looked healthy -- 24-47% drop rate, 46% effective
# sample size -- and a closed loop that threw the ball in ten control steps at
# every weight but one, because a softmax broad enough to average half the cloud
# is also averaging in the quarter of it that drops the object.  The pairing has
# to be a narrow action box first, so that averaging is safe, and only then a
# temperature high enough to average at all.
temp_sample: 1.0
horizon_diffuse_factor: 1.0
traj_diffuse_factor: 0.5
update_method: mppi

# Base environment
dt: 0.02
# 0.01 rather than 0.005: measured side by side the grasp is identical (three
# fingertips in contact, the same settled height, the same squeeze to two
# figures) and a 100-step rollout costs 941 ms instead of 1819 ms.  Contact-rich
# manipulation is expensive enough that a free factor of two matters -- a nine
# weight screen was taking over an hour.
timestep: 0.01
leg_control: position
action_scale: 1.0
kp: 1.0
kd: 0.1

# The goal orientation turns at 1 rad/s about the object's z axis, so the four
# rows stay in competition for the whole episode.  A fixed half-turn goal was
# tried first: DIAL reached it in three seconds and the rest of the episode had
# nothing left to trade off.
goal_rate: 1.0
goal_axis: [0.0, 0.0, 1.0]
randomize_tasks: false

# Row normalizers.  Seeds only -- the screen measures each row's spread across
# the sample cloud and equalises at constant total magnitude.
# Measured on a cloud with a 1.7% drop rate, then equalised at constant total
# magnitude (the multipliers divided by their geometric mean).  The raw spreads
# were 0.0037 / 0.293 / 0.159 / 0.0076: the security row moved the sample
# returns 79x more than the progress row, so any weight carrying security at
# all -- uniform included -- selected the same sample, and six of nine weights
# produced an identical update to four decimals.
progress_scale: 0.109
security_scale: 0.0346
force_scale: 9.42e-6
posture_scale: 0.112
contact_weight: 0.004
# What a grasp that merely holds already presses: the nominal static grasp sits
# at 2.1-2.3e-7 of squared penetration.  Priced from zero, the force row is an
# argument against touching the object rather than against crushing it -- the
# force-boosted weight let go, contact fell to 0.44 fingertips and it dropped
# the ball at step 34, while the pure force corner never touched it at all.
force_baseline: 2.5e-7

action_range: 0.15

reward_weights: [1.0, 1.0, 1.0, 1.0]
